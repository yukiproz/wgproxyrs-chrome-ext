name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/popup.js
      - name: Manifest contract test
        run: node tests/manifest.test.mjs

  package:
    name: Package extension zip
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the extension (load-unpacked folder)
        run: |
          mkdir -p dist
          cp -r extension dist/wgproxyrs-ext
          cd dist && zip -r wgproxyrs-ext.zip wgproxyrs-ext
          unzip -l wgproxyrs-ext.zip
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: wgproxyrs-ext
          path: dist/wgproxyrs-ext.zip
          retention-days: 30
