<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wgproxyrs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>wgproxyrs</h1>
    <div id="status" class="status unreachable"><span class="dot"></span><span id="statusText">checking…</span></div>
  </header>

  <p class="hint">Engine runs in WSL. Start it there first:</p>
  <p class="mono box">wgproxyrs --config uner.conf --bind 127.0.0.1:1080 --http-bind 127.0.0.1:1081 --info-bind 127.0.0.1:1082</p>

  <section>
    <label class="radio"><input type="radio" name="mode" value="socks5" checked> SOCKS5 · 127.0.0.1:1080</label>
    <label class="radio"><input type="radio" name="mode" value="http"> HTTP CONNECT · 127.0.0.1:1081</label>
  </section>

  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" class="danger">Disconnect</button>
  </div>

  <p id="message" class="hint"></p>
  <p id="detail" class="mono"></p>

  <script src="popup.js"></script>
</body>
</html>
