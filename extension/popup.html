<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wgproxyrs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>wgproxyrs</h1>
    <div id="status" class="status unreachable"><span class="dot"></span><span id="statusText">checking…</span></div>
  </header>

  <p class="hint">The engine runs locally on this machine. Start it first:</p>
  <p class="mono box" id="cmdText"></p>

  <section>
    <label class="radio"><input type="radio" name="mode" value="socks5" checked> SOCKS5 · 127.0.0.1:<span id="socksLabel">1080</span></label>
    <label class="radio"><input type="radio" name="mode" value="http"> HTTP CONNECT · 127.0.0.1:<span id="httpLabel">1081</span></label>
  </section>

  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" class="danger">Disconnect</button>
  </div>

  <section>
    <h2>Ports (stored in the extension)</h2>
    <div class="ports">
      <label>SOCKS <input type="number" id="socksPort" min="1" max="65535"></label>
      <label>HTTP <input type="number" id="httpPort" min="1" max="65535"></label>
      <label>Status <input type="number" id="infoPort" min="1" max="65535"></label>
      <button id="setPortsBtn"><strong>Set ports</strong></button>
    </div>
    <p class="hint">Fill the ports, press <strong>Set ports</strong>, and check the confirmation below — it is read back from the system, not from the form.</p>
    <p id="appliedBox" class="mono box" hidden></p>
  </section>

  <p id="message" class="hint"></p>
  <p id="detail" class="mono"></p>

  <script src="popup.js"></script>
</body>
</html>
